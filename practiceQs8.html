<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Attribute</title>
</head>
<body>
    <form action="https://www.google.com/search">
        <input type="text" placeholder="search for google" name="q">
        <button>Search</button>
    </form>
    <hr>
    <form action="https://www.zee5.com/search?q">
                <input type="text" placeholder="search for zee5" name="q">
        <button>Search</button>
    </form>
</body>
</html>
