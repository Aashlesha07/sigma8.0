<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- unorder list -->
     <ul>
        <li>apple</li>
        <li>banana</li>
        <li>mango</li>
     </ul>
<!-- oder list -->
     <ol>
        <li>apple</li>
        <li>banana</li>
        <li>mango</li>
     </ol>
<!-- by using type we can change oder format  -->
     <ol type="A">
        <li>apple</li>
        <li>banana</li>
        <li>mango</li>
     </ol>
<!-- anchore tag -->
     <a href="https://www.google.com/">Google</a>

     <!-- image tag -->
      <img src="bappa.jpg" alt="Ganpati img" height="150px" width="100px">

      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRJMxJWNSG6HlkG5P1ZoV8_aQ9Zq1ybabQQbQ&s" alt="ganpati" srcset="">

      <!-- br tag -->
       <p>Twinkle Twinkle <br> little star <br>how i wonder <br>what you are</p>

       <!-- bold, italic and underline -->
       <p><b>Twinkle Twinkle</b><br> little star <br><i>how i wonder</i><br><u>what you are</u></p>

</body>
</html>
