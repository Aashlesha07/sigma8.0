<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-Level3</title>
</head>

<body>
    <!-- table in html with semantic-->
    <table border="black">
        <caption>
            Food Menu
        </caption>
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Frooti</td>
                <td>10</td>
            </tr>

            <tr>
                <td>Samosa</td>
                <td>12</td>
            </tr>

            <tr>
                <td>Chips</td>
                <td>20</td>
            </tr>
        </tbody>
    </table>

    <!-- colSpan & rowSpan Attribute -->
    <table border="black">
        <caption>Food Menu</caption>
        <thead>
            <tr>
                <th rowspan="2">Items</th>
                <th colspan="2">Price</th>
            </tr>

            <tr>
                <th>INR</th>
                <TH>USD</TH>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Frooti</td>
                <td>10</td>
                <td>0.14</td>
            </tr>

            <tr>
                <td>Samosa</td>
                <td>12</td>
                <td>0.17</td>
            </tr>

            <tr>
                <td>Chips</td>
                <td>20</td>
                <td>0.28</td>
            </tr>
        </tbody>
    </table>

    <!-- form -->
    <form action="/server">
        <input>
        <div>
            <label for="Username">Username </label>
            <input type="text" id="Username" placeholder="Enter email address">
        </div>
        <div>
            <label for="password">password </label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <div>
            <label for="numbar">numbar</label>
            <input type="number" id="numbar" placeholder="Enter Number">
        </div>
        <div>
            <label for="time">time</label>
            <input type="time" id="time">
        </div>
        <div>
            <label for="color">color</label>
            <input type="color" id="color">
        </div>
        <!-- types of button -->
        <button type="submit">Submit</button>
        <button type="button">button</button>
        <button type="reset">reset</button>
        <br>
        <!-- create button in input  -->
        <input type="button" value="click me">
        <input type="submit" value="submit">
        <!-- Name Attribute -->
        <form action="/server">
            <div>
                <label for="Username">Username</label>
                <input type="text" placeholder="Enter Username" id="username" name="user">
            </div>
            <div>
                <label for="password">password</label>
                <input type="password" placeholder="Enter password" id="password" name="pass">
            </div>
            <button type="submit">submit</button>
        </form>
        <hr>
        <form action="https://www.youtube.com/results">
            <input type="text" placeholder="seach in youtube" name="search_queary">
            <button>search</button>
        </form>
        <hr>
        <hr>
        <!--checkbox - input element  -->
        <form action="/server">
            <input type="checkbox" id="age" name="age" checked>
            <label for="age">I am 18+</label>
        </form>
        <hr>
        <form action="/server">
            <input type="checkbox" id="math" name="subject" value="math">
            <label for="math">math</label>
            <input type="checkbox" id="science" name="subject" value="science">
            <label for="science">science</label>
            <input type="checkbox" id="history" name="subject" value="history">
            <label for="history">history</label>
            <button>submit</button>
        </form>
        <hr><hr>
        <!-- redio - input element -->
        <form action="/server">
            <input type="radio" id="apple" name="fruit" value="apple">
            <label for="apple">Apple</label>
            <input type="radio" id="mango" name="fruit" value="mango">
            <label for="mango">mango</label>
            <input type="radio" id="banana" name="fruit" value="banana">
            <label for="banana">banana</label>
            <button>submit</button>
        </form>
        <hr><hr>
        <!-- select - input element -->
         <form action="/server">
         choose your Profection
        <select name="Profection" id="Profection">
            <option selected>select your option</option>
            <option value="student">Student</option>
            <option value="dev">developer</option>
        </select>
        <button>submit</button>
        </form>
        <hr><hr>
        <!-- rang - input element -->
         <form action="/server">
         <label for="vol">Select your volume level:</label>
        <input type="range" id="vol" min="0" max="100" name="vol" step="10" value="60">
        <button>submit</button>
        </form>
        <hr><hr>
        <!-- text area -->
         <form action="/sever">
            <label for="comm">write your comment</label>
            <textarea name="comm" id="comm" rows="5" cols="25" placeholder="write your comments" ></textarea>
            <button>submit</button>
         </form>

</body>

</html>
